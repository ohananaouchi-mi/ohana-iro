<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<style>
.sky1{stop-color:#f3ead6}.sky2{stop-color:#fbf6ea}
.f circle{fill:#ffffff;stroke:#cdbfa6;stroke-width:1.2;opacity:.95}
.f{animation-name:fall,sway;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:normal,alternate}
.f.b{animation-name:fall,sway2}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(1060px)}}
@keyframes sway{from{translate:-18px 0}to{translate:18px 0}}
@keyframes sway2{from{translate:14px 0}to{translate:-14px 0}}
.wire{stroke:#6b5644;stroke-width:2;fill:none;opacity:.45}
.b{fill:#f0b445;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
.roof{fill:#a8382a}.wall{fill:#e9dcc3}.door{fill:#6b4a33}.win{fill:#ffd98a;animation:glow 4s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.7}to{opacity:1}}
.hill{fill:#ffffff;opacity:.85}.tree{fill:#7f9a6b}
@media (prefers-color-scheme: dark){
.sky1{stop-color:#1b1724}.sky2{stop-color:#2b2230}
.wall{fill:#4a3a2c}.hill{fill:#d9dbe6;opacity:.35}.tree{fill:#3f5236}.wire{stroke:#cbb89c;opacity:.35}
.f circle{opacity:.75;stroke:none}.b{fill:#ffe2a0}
}
@media (prefers-reduced-motion: reduce){.f,.b,.win{animation:none}}
</style>
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky1"/><stop offset="1" class="sky2"/></linearGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ffd98a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/></radialGradient></defs>
